<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | ExpenseTracker</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-12">

    <nav class="bg-white border-b border-slate-200 px-4 md:px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-2 shrink-0">
            <div class="bg-blue-600 w-8 h-8 rounded-lg flex items-center justify-center">
                <span class="text-white font-bold text-xl leading-none">E</span>
            </div>
            <h1 class="text-lg md:text-xl font-bold text-slate-800 tracking-tight hidden sm:block">ExpenseTracker <span class="text-blue-600"></span></h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="user-greeting" class="text-sm font-medium text-slate-600 truncate max-w-[120px] sm:max-w-none">Loading...</span>
            <button id="logout-btn" title="Log Out" class="text-slate-400 hover:text-red-600 hover:bg-red-50 p-2.5 rounded-xl transition-all duration-200 active:scale-95 flex items-center justify-center shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" x2="9" y1="12" y2="12"></line>
                </svg>
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-900 rounded-2xl p-6 text-white shadow-xl shadow-slate-900/10">
                <h3 class="text-slate-400 text-sm font-medium mb-1">Total Balance</h3>
                <h2 class="text-4xl font-bold tracking-tight" id="total-balance">₹0.00</h2>
            </div>
            <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
                <h3 class="text-slate-500 text-sm font-medium mb-1 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Total Income
                </h3>
                <h2 class="text-3xl font-bold text-slate-800" id="total-income">₹0.00</h2>
            </div>
            <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm">
                <h3 class="text-slate-500 text-sm font-medium mb-1 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-red-500"></span> Total Expense
                </h3>
                <h2 class="text-3xl font-bold text-slate-800" id="total-expense">₹0.00</h2>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm mb-8">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Income vs Expenses</h2>
            <div class="w-full h-64 relative">
                <canvas id="financeChart"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm sticky top-24">
                    <h2 class="text-lg font-bold text-slate-800 mb-4">Add Transaction</h2>
                    <form id="transaction-form" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Type</label>
                            <select id="trans-type" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Amount (₹)</label>
                            <input type="number" id="trans-amount" placeholder="0.00" step="0.01" required 
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Category</label>
                            <input type="text" id="trans-category" placeholder="e.g. Groceries, Salary" required 
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Date</label>
                            <input type="date" id="trans-date" required 
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Description</label>
                            <input type="text" id="trans-desc" placeholder="Brief note (Optional)" 
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                        <button type="submit" class="w-full bg-blue-600 text-white font-semibold rounded-xl px-4 py-3 hover:bg-blue-700 active:scale-[0.98] transition-all">
                            Save Transaction
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl p-6 border border-slate-100 shadow-sm min-h-[500px]">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                        <h2 class="text-lg font-bold text-slate-800">Transactions</h2>
                        
                        <!-- Advanced Filtering & Export -->
                        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                            <select id="filter-time" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                                <option value="all">All Time</option>
                                <option value="today">Today</option>
                                <option value="week">This Week</option>
                                <option value="month">This Month</option>
                            </select>
                            
                            <select id="filter-type" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer">
                                <option value="all">All Types</option>
                                <option value="income">Income Only</option>
                                <option value="expense">Expenses Only</option>
                            </select>

                            <button id="export-btn" title="Download CSV" class="bg-slate-800 text-white p-2.5 rounded-xl hover:bg-slate-700 transition-colors active:scale-95 flex items-center justify-center shadow-sm">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2-2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div id="transaction-list" class="space-y-3">
                        <div class="text-center text-slate-500 py-10">Loading transactions...</div>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

    <script src="config.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
